<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aysnc Project 1</title>
</head>
<body>
    <h1>Love to Learn JS</h1>
    <button id="start">Start</button>
    <button id="stop">Stop</button>
</body>
<script>
  let intervalID;
  document.querySelector("#start").addEventListener("click",()=>{
   if(!intervalID)
   {
   intervalID = setInterval(function (){
   //document.querySelector("h1").textContent="Love to learn C Sharp";
   //console.log("Sourish is here....")
   console.log("Interval running");
  },2000);
  console.log("Started interval:", intervalID);
  }
  else{
    console.log("Interval already running!");
  }
  });

  document.querySelector("#stop").addEventListener("click",()=>{
   clearInterval(intervalID);
   console.log("Interval stopped:", intervalID);
   intervalID = null;
  });
</script>
</html>
