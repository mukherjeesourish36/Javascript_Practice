<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>
<script>
    function addElements(lang){
       const li = document.createElement("li");
       li.innerHTML = lang;
       document.querySelector(".language").appendChild(li);
    }
    addElements("C++")
    addElements("Python")
   
    function addElementsOpti(lang){
       const li = document.createElement("li");
       li.appendChild(document.createTextNode(lang))
       document.querySelector(".language").appendChild(li);
    }
     addElementsOpti("Go Lang")

     const l= document.querySelector("li:nth-child(2)")
     //l.innerHTML="C Sharp"
     const n = document.createElement("li");
     n.textContent="CSS"
     l.replaceWith(n)

</script>
</html>
